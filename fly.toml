# fly.toml — replace "flight-tracker" with your chosen app name
app = "flight-tracker"
primary_region = "lhr"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # keep alive so APScheduler fires daily
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "flight_data"       # volume name — created in step 4 below
  destination = "/app/instance"

[env]
  FLASK_ENV = "production"
