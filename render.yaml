services:
  - type: web
    name: flight-tracker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 120 main:app
    envVars:
      - key: ENABLE_SCHEDULER
        value: false          # GitHub Actions handles scheduling
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL     # Set this in Render dashboard — paste Neon connection string
        sync: false
      - key: SECRET_KEY       # Set in Render dashboard
        sync: false
      - key: SERPAPI_KEY      # Set in Render dashboard
        sync: false
      - key: GMAIL_ADDRESS    # Set in Render dashboard
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: ALERT_EMAIL
        sync: false
